<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#FFE699">
  <title>mdEditor</title>
  <link rel="icon" href="assets/5garashi_mark_simple.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="brand-bar">
    <div class="brand-lockup">
      <img class="brand-logo" src="assets/5garashi_logotype_outlined.svg" alt="5garashi.com 設計事務所 / 5garashi.com Design Office">
      <h1>mdEditor</h1>
    </div>
    <img class="brand-mark" src="assets/5garashi_mark_simple.svg" alt="" aria-hidden="true">
  </header>
  <section class="toolbar" data-i18n-attr="aria-label:toolbar">
    <div class="document-status" aria-live="polite">
      <span id="document-name">新しい文書.md</span>
      <span id="save-state">保存済み</span>
      <span class="drop-hint" data-i18n="dropHint">ここに .md ファイルをドロップして開く</span>
    </div>
    <div class="actions">
      <button id="open-button" type="button" data-i18n="open" data-i18n-attr="title:openTitle">開く</button>
      <button id="save-button" class="primary" type="button" data-i18n="save" data-i18n-attr="title:saveTitle">保存</button>
      <button id="save-as-button" type="button" data-i18n="saveAs">名前を付けて保存</button>
      <button id="pdf-button" type="button" data-i18n="pdf">PDFに保存</button>
      <button id="language-button" type="button" lang="en" data-i18n="languageToggle" data-i18n-attr="aria-label:languageLabel">English</button>
    </div>
  </section>
  <main class="workspace">
    <section class="pane editor-pane" aria-labelledby="editor-heading">
      <div class="pane-heading">
        <h2 id="editor-heading" data-i18n="editorHeading">Markdown を編集</h2>
        <button id="replace-button" type="button" data-i18n="findReplace" data-i18n-attr="title:findReplaceTitle">検索・置換</button>
        <button class="pane-fullscreen-button" type="button" data-fullscreen-mode="editor" aria-pressed="false">編集画面をウィンドウ全体に表示</button>
      </div>
      <div id="find-bar" class="find-bar" role="search" hidden>
        <div class="find-row find-section">
          <span class="find-label" data-i18n="findLabel">検索</span>
          <input id="find-input" type="text" data-i18n-attr="placeholder:findPlaceholder;aria-label:findPlaceholder" autocomplete="off" spellcheck="false">
          <button id="find-prev" type="button" data-i18n="findPrev">前へ</button>
          <button id="find-next" type="button" data-i18n="findNext">次へ</button>
          <label class="find-case"><input id="find-case" type="checkbox"> <span data-i18n="matchCase">大文字小文字を区別</span></label>
          <button id="find-close" type="button" data-i18n="close" data-i18n-attr="aria-label:close">閉じる</button>
        </div>
        <div class="find-row replace-section">
          <span class="find-label" data-i18n="replaceLabel">置換</span>
          <input id="replace-input" type="text" data-i18n-attr="placeholder:replacePlaceholder;aria-label:replacePlaceholder" autocomplete="off" spellcheck="false">
          <button id="replace-one" type="button" data-i18n="replaceOne">置換</button>
          <button id="replace-all" type="button" data-i18n="replaceAll">すべて置換</button>
          <span id="find-status" class="find-status" aria-live="polite"></span>
        </div>
      </div>
      <textarea id="editor" data-i18n-attr="aria-label:editorLabel" aria-label="Markdown テキスト" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
    </section>
    <div id="pane-divider"
         class="pane-divider"
         role="separator"
         tabindex="0"
         data-i18n-attr="aria-label:dividerLabel;title:dividerTitle"
         aria-label="編集画面とプレビューの幅"
         aria-orientation="vertical"
         aria-valuemin="20"
         aria-valuemax="80"
         aria-valuenow="50"
         aria-valuetext="編集画面 50%、プレビュー 50%"
         title="ドラッグまたは矢印キーで左右の幅を調整します"></div>
    <section class="pane preview-pane" aria-labelledby="preview-heading">
      <div class="pane-heading">
        <h2 id="preview-heading" data-i18n="previewHeading">プレビュー</h2>
        <button class="pane-fullscreen-button" type="button" data-fullscreen-mode="preview" aria-pressed="false">プレビューをウィンドウ全体に表示</button>
      </div>
      <article id="preview"
               class="preview-content"
               data-i18n-attr="aria-label:previewLabel"
               aria-label="Markdown の表示結果"></article>
    </section>
  </main>
</body>
</html>
